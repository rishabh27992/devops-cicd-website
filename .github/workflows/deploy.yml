name: CI/CD Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test


  build:
    name: Build
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build website
        run: npm run build

      - name: Package website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/


  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download website
        uses: actions/download-artifact@v4
        with:
          name: website
          path: dist/

      - name: Check GitHub OIDC environment
        run: |
           echo "Repository: $GITHUB_REPOSITORY"
           echo "Repository ID: $GITHUB_REPOSITORY_ID"
           echo "Repository Owner ID: $GITHUB_REPOSITORY_OWNER_ID"
           echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
           echo "Ref: $GITHUB_REF"
           echo "Workflow: $GITHUB_WORKFLOW"
           echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::646538133260:role/GitHubActionsDevOpsDeploymentRole
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Clear CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"